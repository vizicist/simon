<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sigil Sequence Ritual</title>
    <link rel="stylesheet" href="styles.css?v=32">
  </head>
  <body>
    <main class="app" aria-labelledby="title">
      <button class="advanced-hotspot" id="advanced-hotspot" type="button" aria-label="Advanced access"></button>

      <section class="stage">
        <div class="status-bar">
          <div>
            <h1 id="title">Sigil Sequence Ritual</h1>
            <p id="subtitle"></p>
          </div>
        </div>

        <div class="board" aria-label="Simon pads">
          <button class="pad pad-green" data-pad="0" aria-label="Green pad">
            <img class="pad-shape" src="assets/shapes/chaos.svg" alt="">
            <span class="pad-note" id="note-0">unmapped</span>
          </button>
          <button class="pad pad-red" data-pad="1" aria-label="Red pad">
            <img class="pad-shape" src="assets/shapes/oracle.svg" alt="">
            <span class="pad-note" id="note-1">unmapped</span>
          </button>
          <button class="pad pad-yellow" data-pad="2" aria-label="Yellow pad">
            <img class="pad-shape" src="assets/shapes/directive.svg" alt="">
            <span class="pad-note" id="note-2">unmapped</span>
          </button>
          <button class="pad pad-blue" data-pad="3" aria-label="Blue pad">
            <img class="pad-shape" src="assets/shapes/sacred.svg" alt="">
            <span class="pad-note" id="note-3">unmapped</span>
          </button>
        </div>

        <div class="controls" aria-label="Game controls">
          <button id="start" type="button">Start Ritual - Complete 8 Steps</button>
          <button id="hall-of-fame-challenge" type="button">Hall of Fame Challenge</button>
        </div>
      </section>

      <section class="advanced-page" id="advanced-page" aria-labelledby="advanced-title" aria-modal="true" role="dialog" hidden>
        <div class="advanced-panel">
          <h2 id="advanced-title">Advanced Mode</h2>
          <div class="advanced-actions" aria-label="Advanced controls">
            <button id="connect" type="button">Connect MIDI</button>
            <button id="learn" type="button">Learn Pads</button>
            <button id="advanced-achievements" type="button">Sigil Sequence Hall of Fame</button>
          </div>
          <div class="midi-panel">
            <label for="midi-input">MIDI input</label>
            <select id="midi-input"></select>
            <span id="midi-state">Web MIDI not connected</span>
          </div>
          <div class="goal-panel">
            <label for="sequence-goal">Sequence Goal</label>
            <select id="sequence-goal">
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
              <option value="13">13</option>
              <option value="14">14</option>
              <option value="15">15</option>
              <option value="16">16</option>
              <option value="17">17</option>
              <option value="18">18</option>
              <option value="19">19</option>
              <option value="20">20</option>
              <option value="unlimited">unlimited</option>
            </select>
          </div>
          <div class="timing-panel">
            <label for="sequence-timing">Sequence Step Timing</label>
            <input id="sequence-timing" type="range" min="0.25" max="1" step="0.05" value="1">
            <output id="sequence-timing-value" for="sequence-timing">1.00s</output>
          </div>
          <button class="advanced-return" id="advanced-return" type="button">Return to Main Page</button>
        </div>
      </section>

      <section class="result-overlay" id="result-overlay" aria-labelledby="result-title" aria-modal="true" role="dialog" hidden>
        <div class="result-dialog">
          <h2 id="result-title">Missed</h2>
          <div class="result-stats" aria-label="Game result">
            <span>
              <strong id="result-steps">0</strong>
              steps
            </span>
            <span>
              <strong id="result-time">0:00</strong>
              time
            </span>
          </div>
          <p id="result-detail">Press Start to play again.</p>
          <div class="sigil-message-panel" id="sigil-message-panel" hidden>
            <h3>Select the Sigil message you want to hear</h3>
            <div class="sigil-message-actions" aria-label="Sigil messages">
              <button class="sigil-message-button" type="button" data-sigil="chaos" aria-label="Play Chaos sigil message">
                <img src="assets/shapes/chaos.svg" alt="">
              </button>
              <button class="sigil-message-button" type="button" data-sigil="oracle" aria-label="Play Oracle sigil message">
                <img src="assets/shapes/oracle.svg" alt="">
              </button>
              <button class="sigil-message-button" type="button" data-sigil="directive" aria-label="Play Directive sigil message">
                <img src="assets/shapes/directive.svg" alt="">
              </button>
              <button class="sigil-message-button" type="button" data-sigil="sacred" aria-label="Play Sacred sigil message">
                <img src="assets/shapes/sacred.svg" alt="">
              </button>
            </div>
          </div>
          <div class="result-actions">
            <button id="result-start" type="button">Start Again</button>
            <button id="result-achievements" type="button">Sigil Sequence Hall of Fame</button>
            <button id="result-close" type="button">Close</button>
          </div>
        </div>
      </section>

      <section class="achievements-page" id="achievements-page" aria-labelledby="achievements-title" aria-modal="true" role="dialog" hidden>
        <div class="achievements-panel">
          <h2 id="achievements-title">Sigil Sequence Hall of Fame</h2>
          <ol class="achievement-list" id="achievement-list"></ol>
          <p class="achievement-empty" id="achievement-empty">Complete a run to begin the record.</p>
          <div class="result-actions">
            <button id="achievements-close" type="button">Return</button>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js?v=36"></script>
  </body>
</html>
